<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Page not found — ShikshaOS</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/shikshaos-showcase/favicon.svg" type="image/svg+xml" />
  <!-- Self-contained on purpose: GitHub Pages serves this for any depth of URL,
       so relative asset paths would break. Tokens inlined, no webfont. -->
  <style>
    :root { color-scheme: dark; --canvas:#0a0b0d; --ink:#f4f4f5; --ink-muted:#9b9da6;
            --ink-faint:#7a7c86; --accent:#ff5d2e; }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; --canvas:#f4f3ef; --ink:#12131a; --ink-muted:#54565f;
              --ink-faint:#6b6d75; --accent:#c93c0d; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
           padding:2rem; background:var(--canvas); color:var(--ink);
           font-family:"Geist",ui-sans-serif,system-ui,sans-serif; }
    .n { font-family:ui-monospace,monospace; font-size:11px; text-transform:uppercase;
         letter-spacing:0.18em; color:var(--accent); margin:0 0 1rem; }
    h1 { margin:0; font-size:clamp(2rem,7vw,3rem); letter-spacing:-0.03em; }
    p { margin:1rem 0 2rem; color:var(--ink-muted); max-width:38ch; }
    a { display:inline-block; border-radius:999px; background:var(--accent); color:var(--canvas);
        padding:0.75rem 1.5rem; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <p class="n">404</p>
    <h1>This page doesn't exist.</h1>
    <p>The showcase is a single page — everything lives on the home page.</p>
    <a href="/shikshaos-showcase/">Back to ShikshaOS</a>
  </main>
</body>
</html>
